[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ioc-hunter"
version = "1.0.0"
description = "Threat-intel enrichment CLI for SOC analysts (VirusTotal, AbuseIPDB, AlienVault OTX)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Defa Mulya Pratama" }]
keywords = ["security", "soc", "threat-intelligence", "ioc", "virustotal", "abuseipdb", "otx"]
dependencies = [
    "requests>=2.28",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
ioc-hunter = "ioc_hunter.cli:main"

[tool.setuptools]
packages = ["ioc_hunter", "ioc_hunter.providers"]
